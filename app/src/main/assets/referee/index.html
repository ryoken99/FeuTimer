<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#080707" />
  <title>FEU BJJ · Comando do Placar</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #080707;
      --card: #141212;
      --card-2: #1e1b1b;
      --line: rgba(255, 255, 255, 0.16);
      --line-strong: rgba(255, 255, 255, 0.32);
      --red: #e8141b;
      --red-deep: #b80d12;
      --gold: #d9b234;
      --green: #2fb37d;
      --white: #f8f5f0;
      --muted: #bfb8ad;
      --font: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100dvh;
      max-height: 100dvh;
      overflow: hidden;
      background: var(--bg);
      color: var(--white);
      font-family: var(--font);
      -webkit-font-smoothing: antialiased;
      user-select: none;
      -webkit-user-select: none;
    }

    input {
      user-select: text;
      -webkit-user-select: text;
    }

    button {
      font: inherit;
      color: inherit;
      background: var(--card-2);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 0;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      transition: transform 0.06s ease, background 0.12s ease;
    }
    button:active {
      transform: scale(0.95);
      background: rgba(255, 255, 255, 0.22);
    }

    /* Portrait Single-Screen Grid: fits 100% inside 100dvh with zero scrolling */
    .console {
      width: 100%;
      max-width: 480px;
      height: 100dvh;
      margin: 0 auto;
      padding: max(6px, env(safe-area-inset-top)) 8px max(6px, env(safe-area-inset-bottom));
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      grid-template-rows: auto auto minmax(0, 1fr) minmax(0, 1fr) auto;
      gap: 6px;
    }
    .console > * { min-width: 0; }

    /* 1. Top Status + Category Bar */
    .topbar {
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      gap: 6px;
    }
    .conn-pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 0 9px;
      height: 32px;
      border-radius: 999px;
      background: var(--card);
      border: 1px solid var(--line);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.04em;
    }
    .conn-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--gold);
    }
    .conn-pill.is-live .conn-dot {
      background: var(--green);
      box-shadow: 0 0 8px var(--green);
    }
    .cat-input {
      width: 100%;
      height: 32px;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: var(--card);
      color: var(--gold);
      padding: 0 10px;
      font-size: 13px;
      font-weight: 700;
      outline: none;
    }
    .cat-input::placeholder {
      color: rgba(191, 184, 173, 0.55);
      font-weight: 600;
    }
    .cat-input:focus {
      border-color: var(--gold);
    }
    .hist-btn {
      height: 32px;
      padding: 0 10px;
      border-radius: 999px;
      background: rgba(217, 178, 52, 0.16);
      border-color: rgba(217, 178, 52, 0.5);
      color: var(--gold);
      font-size: 12px;
      gap: 4px;
      white-space: nowrap;
    }

    /* 2. Match Clock & Belt Duration Strip */
    .clock-card {
      background: var(--card);
      border: 1px solid var(--line-strong);
      border-radius: 12px;
      padding: 6px 8px;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    .clock-main {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto auto;
      align-items: center;
      gap: 5px;
    }
    .clock-readout {
      font-size: clamp(26px, 7.4vw, 36px);
      font-weight: 900;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.02em;
      color: var(--gold);
      padding: 2px 8px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px dashed rgba(255, 255, 255, 0.2);
    }
    .clock-readout.is-running {
      color: var(--white);
      border-style: solid;
      border-color: var(--green);
    }
    .clock-deltas {
      display: flex;
      gap: 4px;
      min-width: 0;
      justify-content: center;
    }
    .clock-deltas button {
      height: 36px;
      padding: 0 7px;
      font-size: 12px;
      font-variant-numeric: tabular-nums;
    }
    .play-btn {
      height: 40px;
      padding: 0 14px;
      border-radius: 999px;
      background: var(--white);
      color: var(--bg);
      border-color: #fff;
      font-size: 13.5px;
      gap: 5px;
      white-space: nowrap;
    }
    .play-btn.is-running {
      background: var(--red);
      color: var(--white);
      border-color: var(--white);
    }
    .reset-mini {
      height: 40px;
      width: 40px;
      border-radius: 10px;
      font-size: 16px;
    }
    .belt-strip {
      display: grid;
      grid-template-columns: repeat(9, 1fr);
      gap: 4px;
    }
    .belt-pill {
      height: 25px;
      border-radius: 999px;
      font-size: 10.5px;
      font-variant-numeric: tabular-nums;
      background: rgba(255, 255, 255, 0.05);
    }
    .belt-pill.is-on {
      background: var(--red);
      border-color: rgba(255, 255, 255, 0.75);
    }

    /* 3 & 4. Athlete Control Cards (A = White, B = Red) */
    .fighter {
      background: var(--card);
      border: 1.5px solid rgba(248, 245, 240, 0.5);
      border-radius: 14px;
      padding: 7px 9px;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
      gap: 6px;
      min-height: 0;
    }
    .fighter--b {
      border-color: rgba(232, 20, 27, 0.75);
      background: linear-gradient(180deg, rgba(232, 20, 27, 0.09), var(--card));
    }

    .name-row {
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      gap: 6px;
    }
    .corner-tag {
      font-size: 10px;
      font-weight: 900;
      padding: 3px 6px;
      border-radius: 5px;
      letter-spacing: 0.06em;
      background: var(--white);
      color: var(--bg);
    }
    .fighter--b .corner-tag {
      background: var(--red);
      color: var(--white);
    }
    .name-input {
      width: 100%;
      height: 32px;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: rgba(0, 0, 0, 0.35);
      color: var(--white);
      padding: 0 9px;
      font-size: 14.5px;
      font-weight: 800;
      outline: none;
    }
    .name-input:focus {
      border-color: var(--gold);
    }
    .clear-btn {
      width: 30px;
      height: 30px;
      border-radius: 8px;
      font-size: 13px;
      color: var(--muted);
    }

    .score-zone {
      display: grid;
      grid-template-columns: 88px 1fr;
      align-items: stretch;
      gap: 8px;
      min-height: 0;
    }
    .pts-box {
      border-radius: 11px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px dashed var(--line-strong);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2px;
    }
    .pts-num {
      font-size: clamp(40px, 11vw, 54px);
      font-weight: 900;
      line-height: 0.95;
      font-variant-numeric: tabular-nums;
    }
    .pts-hint {
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.08em;
      color: var(--muted);
      text-transform: uppercase;
      margin-top: 2px;
    }

    .pts-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: 1fr 1fr;
      gap: 5px;
      min-height: 0;
    }
    .pt-btn {
      height: 100%;
      min-height: 32px;
      border-radius: 9px;
      font-size: 15.5px;
      font-weight: 900;
      font-variant-numeric: tabular-nums;
    }
    .pt-btn--pos {
      background: rgba(47, 179, 125, 0.16);
      border-color: rgba(47, 179, 125, 0.48);
      color: #7bf0bd;
    }
    .pt-btn--neg {
      background: rgba(255, 255, 255, 0.06);
      color: var(--muted);
    }

    .sub-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }
    .sub-ctrl {
      display: grid;
      grid-template-columns: 32px 1fr 32px;
      align-items: center;
      height: 32px;
      border-radius: 8px;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid var(--line);
      overflow: hidden;
    }
    .sub-ctrl button {
      height: 100%;
      border: 0;
      border-radius: 0;
      background: rgba(255, 255, 255, 0.06);
      font-size: 16px;
    }
    .sub-val {
      text-align: center;
      font-size: 12px;
      font-weight: 850;
      font-variant-numeric: tabular-nums;
      cursor: pointer;
    }
    .sub-val--adv { color: var(--gold); }
    .sub-val--pen { color: #ff6e73; }

    /* 5. Compact Bottom Utility Bar */
    .footer-bar {
      display: grid;
      grid-template-columns: auto auto 1fr;
      gap: 6px;
    }
    .foot-btn {
      height: 38px;
      padding: 0 12px;
      border-radius: 10px;
      font-size: 12.5px;
      gap: 5px;
    }
    .save-cta {
      background: linear-gradient(135deg, var(--red), var(--red-deep));
      border-color: rgba(255, 255, 255, 0.45);
      font-size: 13.5px;
    }

    /* Slide-up Modals (Direct Edit, Save Match, Results History) */
    .sheet-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.78);
      z-index: 40;
      display: none;
      align-items: flex-end;
      justify-content: center;
    }
    .sheet-backdrop.is-open {
      display: flex;
    }
    .sheet {
      width: 100%;
      max-width: 480px;
      max-height: 88dvh;
      background: #151313;
      border-top: 2px solid var(--gold);
      border-radius: 18px 18px 0 0;
      padding: 14px 14px max(16px, env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .sheet__head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .sheet__title {
      font-size: 16px;
      font-weight: 900;
    }
    .pill-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .choice-pill {
      height: 34px;
      padding: 0 12px;
      border-radius: 999px;
      font-size: 12.5px;
    }
    .choice-pill.is-on {
      background: var(--red);
      border-color: #fff;
    }

    .results-list {
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 58dvh;
      padding-right: 2px;
    }
    .res-card {
      background: var(--card-2);
      border: 1px solid var(--line);
      border-radius: 11px;
      padding: 9px 11px;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    .res-card__meta {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: var(--muted);
      font-weight: 700;
    }
    .res-card__line {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13.5px;
      font-weight: 800;
    }
    .res-card__win {
      color: var(--gold);
    }
    .res-card__actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      padding-top: 6px;
      margin-top: 2px;
    }
    .res-badge {
      font-size: 11px;
      font-weight: 800;
      color: var(--green);
    }
    .mini-act {
      height: 28px;
      padding: 0 10px;
      border-radius: 7px;
      font-size: 11.5px;
      gap: 4px;
    }
    .mini-act--danger {
      background: rgba(232, 20, 27, 0.16);
      border-color: rgba(232, 20, 27, 0.45);
      color: #ff8085;
    }

    .edit-input {
      width: 100%;
      height: 46px;
      border-radius: 10px;
      border: 1.5px solid var(--gold);
      background: #0b0a0a;
      color: var(--white);
      font-size: 24px;
      font-weight: 900;
      text-align: center;
      font-variant-numeric: tabular-nums;
      outline: none;
    }

    .toast {
      position: fixed;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      background: #1e1c1c;
      border: 1px solid var(--gold);
      color: var(--white);
      padding: 7px 14px;
      border-radius: 999px;
      font-size: 12.5px;
      font-weight: 800;
      z-index: 90;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.18s ease;
    }
    .toast.is-shown {
      opacity: 1;
    }

    /* ======================================================================
       LANDSCAPE: same single-screen, zero-scroll console re-laid out as
       [ BRANCO ] [ clock + controls ] [ VERMELHO ] under one top bar.
       ====================================================================== */
    @media (orientation: landscape) {
      .console {
        max-width: 1100px;
        grid-template-columns: minmax(0, 1fr) minmax(250px, 0.82fr) minmax(0, 1fr);
        grid-template-rows: auto minmax(0, 1fr) auto;
        grid-template-areas:
          "top top top"
          "a   clock b"
          "a   foot  b";
        column-gap: 8px;
        row-gap: 6px;
      }
      .topbar { grid-area: top; }
      .clock-card { grid-area: clock; min-height: 0; justify-content: space-between; }
      .fighter--a { grid-area: a; }
      .fighter--b { grid-area: b; }
      .footer-bar { grid-area: foot; grid-template-columns: 1fr 1fr; }
      .footer-bar .save-cta { grid-column: 1 / -1; }

      /* clock card becomes a vertical stack that fits the narrow centre column */
      .clock-main {
        grid-template-columns: 1fr auto;
        grid-template-areas:
          "read  read"
          "delta delta"
          "play  reset";
        gap: 5px;
      }
      .clock-readout { grid-area: read; text-align: center; font-size: clamp(30px, 11vh, 46px); }
      .clock-deltas { grid-area: delta; justify-content: center; }
      .clock-deltas button { flex: 1; }
      .play-btn { grid-area: play; width: 100%; }
      .reset-mini { grid-area: reset; }
      .belt-strip { grid-template-columns: repeat(5, 1fr); }
      .belt-pill { height: 24px; font-size: 11px; }

      .fighter { padding: 6px 8px; gap: 5px; }
      .score-zone { grid-template-columns: 74px 1fr; gap: 6px; }
      .pts-num { font-size: clamp(32px, 11vh, 48px); }
      .pt-btn { min-height: 26px; font-size: 14px; }
      .name-input, .cat-input { height: 30px; }
      .sub-ctrl { height: 30px; }
      .foot-btn { height: 34px; padding: 0 8px; font-size: 12px; }

      .sheet { max-width: 720px; max-height: 92dvh; padding: 10px 14px max(10px, env(safe-area-inset-bottom)); }
      .results-list { max-height: 44dvh; }
    }

    /* very short landscape phones (e.g. 360-400px tall browser area) */
    @media (orientation: landscape) and (max-height: 430px) {
      .console { padding: max(4px, env(safe-area-inset-top)) 6px max(4px, env(safe-area-inset-bottom)); row-gap: 4px; }
      .conn-pill, .hist-btn, .cat-input { height: 28px; }
      .clock-card { padding: 4px 6px; gap: 4px; }
      .clock-deltas button { height: 30px; font-size: 12px; }
      .play-btn, .reset-mini { height: 34px; }
      .belt-pill { height: 22px; }
      .fighter { gap: 4px; }
      .pts-hint { display: none; }
      .corner-tag { font-size: 9px; padding: 2px 5px; }
    }
  </style>
</head>
<body>
  <div id="toast" class="toast"></div>

  <main class="console">
    <!-- Row 1: Live Connection + Division + Results Button -->
    <header class="topbar">
      <div id="conn-pill" class="conn-pill">
        <span class="conn-dot"></span>
        <span id="conn-label">TV</span>
      </div>
      <input id="inp-category" class="cat-input" type="text" maxlength="48" placeholder="Categoria / Faixa (opcional)" autocomplete="off" />
      <button type="button" id="btn-open-results" class="hist-btn">📋 <span id="res-count">0</span></button>
    </header>

    <!-- Row 2: Match Clock & Belt Duration Selector -->
    <section class="clock-card">
      <div class="clock-main">
        <button type="button" id="btn-clock-edit" class="clock-readout" title="Toca para editar o tempo">05:00</button>
        <div class="clock-deltas">
          <button type="button" data-cmd="time_delta" data-delta="-10">−10s</button>
          <button type="button" data-cmd="time_delta" data-delta="10">+10s</button>
        </div>
        <button type="button" id="btn-play-pause" class="play-btn">▶ INICIAR</button>
        <button type="button" id="btn-reset" class="reset-mini" title="Nova Luta (0-0)">↺</button>
      </div>
      <div class="belt-strip">
        <button type="button" class="belt-pill" data-dur="60">1m</button>
        <button type="button" class="belt-pill" data-dur="120">2m</button>
        <button type="button" class="belt-pill" data-dur="180">3m</button>
        <button type="button" class="belt-pill" data-dur="240">4m</button>
        <button type="button" class="belt-pill is-on" data-dur="300">5m</button>
        <button type="button" class="belt-pill" data-dur="360">6m</button>
        <button type="button" class="belt-pill" data-dur="420">7m</button>
        <button type="button" class="belt-pill" data-dur="480">8m</button>
        <button type="button" class="belt-pill" data-dur="600">10m</button>
      </div>
    </section>

    <!-- Row 3: Athlete 1 (White) -->
    <section class="fighter fighter--a">
      <div class="name-row">
        <span class="corner-tag">BRANCO</span>
        <input id="inp-name-a" class="name-input" type="text" maxlength="40" placeholder="Nome do Atleta 1" autocomplete="off" />
        <button type="button" class="clear-btn" data-clear-name="A" aria-label="Limpar nome">✕</button>
      </div>
      <div class="score-zone">
        <button type="button" class="pts-box" data-edit-score="A:points">
          <span id="val-a-pts" class="pts-num">0</span>
          <span class="pts-hint">✎ Pontos</span>
        </button>
        <div class="pts-grid">
          <button type="button" class="pt-btn pt-btn--pos" data-score="A:points:2">+2</button>
          <button type="button" class="pt-btn pt-btn--pos" data-score="A:points:3">+3</button>
          <button type="button" class="pt-btn pt-btn--pos" data-score="A:points:4">+4</button>
          <button type="button" class="pt-btn pt-btn--pos" data-score="A:points:1">+1</button>
          <button type="button" class="pt-btn pt-btn--neg" data-score="A:points:-1">−1</button>
          <button type="button" class="pt-btn pt-btn--neg" data-score="A:points:-2">−2</button>
        </div>
      </div>
      <div class="sub-row">
        <div class="sub-ctrl">
          <button type="button" data-score="A:advantages:-1">−</button>
          <span id="val-a-adv" class="sub-val sub-val--adv" data-edit-score="A:advantages">VANT: 0</span>
          <button type="button" data-score="A:advantages:1">+</button>
        </div>
        <div class="sub-ctrl">
          <button type="button" data-score="A:penalties:-1">−</button>
          <span id="val-a-pen" class="sub-val sub-val--pen" data-edit-score="A:penalties">PUN: 0</span>
          <button type="button" data-score="A:penalties:1">+</button>
        </div>
      </div>
    </section>

    <!-- Row 4: Athlete 2 (Red) -->
    <section class="fighter fighter--b">
      <div class="name-row">
        <span class="corner-tag">VERMELHO</span>
        <input id="inp-name-b" class="name-input" type="text" maxlength="40" placeholder="Nome do Atleta 2" autocomplete="off" />
        <button type="button" class="clear-btn" data-clear-name="B" aria-label="Limpar nome">✕</button>
      </div>
      <div class="score-zone">
        <button type="button" class="pts-box" data-edit-score="B:points">
          <span id="val-b-pts" class="pts-num">0</span>
          <span class="pts-hint">✎ Pontos</span>
        </button>
        <div class="pts-grid">
          <button type="button" class="pt-btn pt-btn--pos" data-score="B:points:2">+2</button>
          <button type="button" class="pt-btn pt-btn--pos" data-score="B:points:3">+3</button>
          <button type="button" class="pt-btn pt-btn--pos" data-score="B:points:4">+4</button>
          <button type="button" class="pt-btn pt-btn--pos" data-score="B:points:1">+1</button>
          <button type="button" class="pt-btn pt-btn--neg" data-score="B:points:-1">−1</button>
          <button type="button" class="pt-btn pt-btn--neg" data-score="B:points:-2">−2</button>
        </div>
      </div>
      <div class="sub-row">
        <div class="sub-ctrl">
          <button type="button" data-score="B:advantages:-1">−</button>
          <span id="val-b-adv" class="sub-val sub-val--adv" data-edit-score="B:advantages">VANT: 0</span>
          <button type="button" data-score="B:advantages:1">+</button>
        </div>
        <div class="sub-ctrl">
          <button type="button" data-score="B:penalties:-1">−</button>
          <span id="val-b-pen" class="sub-val sub-val--pen" data-edit-score="B:penalties">PUN: 0</span>
          <button type="button" data-score="B:penalties:1">+</button>
        </div>
      </div>
    </section>

    <!-- Row 5: Swap, Buzzer & Save Result -->
    <footer class="footer-bar">
      <button type="button" id="btn-swap" class="foot-btn">⇄ Trocar</button>
      <button type="button" id="btn-buzzer" class="foot-btn">🔔 Buzina</button>
      <button type="button" id="btn-open-save" class="foot-btn save-cta">💾 Guardar Resultado</button>
    </footer>
  </main>

  <!-- Direct Score / Clock Edit Modal -->
  <div id="sheet-edit" class="sheet-backdrop">
    <div class="sheet">
      <div class="sheet__head">
        <span id="edit-title" class="sheet__title">Editar Valor</span>
        <button type="button" class="mini-act" data-close-sheet="sheet-edit">✕ Fechar</button>
      </div>
      <input id="inp-direct-val" class="edit-input" type="text" inputmode="numeric" autocomplete="off" />
      <button type="button" id="btn-apply-edit" class="foot-btn save-cta" style="width:100%">✓ Aplicar Imediatamente</button>
    </div>
  </div>

  <!-- Save Match Result Modal -->
  <div id="sheet-save" class="sheet-backdrop">
    <div class="sheet">
      <div class="sheet__head">
        <span class="sheet__title">Guardar Resultado da Luta</span>
        <button type="button" class="mini-act" data-close-sheet="sheet-save">✕</button>
      </div>
      <div style="font-size:12px;color:var(--muted);font-weight:700">Vencedor:</div>
      <div id="winner-pills" class="pill-row"></div>
      <div style="font-size:12px;color:var(--muted);font-weight:700">Método:</div>
      <div id="method-pills" class="pill-row"></div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:4px">
        <button type="button" id="btn-save-only" class="foot-btn">💾 Só Guardar</button>
        <button type="button" id="btn-save-next" class="foot-btn save-cta">💾 Guardar + Nova</button>
      </div>
    </div>
  </div>

  <!-- Saved Results History Sheet (Share / Export / Delete One / Delete All) -->
  <div id="sheet-results" class="sheet-backdrop">
    <div class="sheet">
      <div class="sheet__head">
        <span class="sheet__title">Resultados Guardados (<span id="sheet-res-total">0</span>)</span>
        <button type="button" class="mini-act" data-close-sheet="sheet-results">✕ Fechar</button>
      </div>
      <div style="display:flex;gap:6px;flex-wrap:wrap">
        <button type="button" id="btn-share-all" class="mini-act">📤 Partilhar Tudo</button>
        <button type="button" id="btn-export-csv" class="mini-act">⬇ CSV</button>
        <button type="button" id="btn-clear-all" class="mini-act mini-act--danger" style="margin-left:auto">🗑 Apagar Tudo</button>
      </div>
      <div id="results-list" class="results-list"></div>
    </div>
  </div>

  <script>
    (function () {
      'use strict';

      let state = {
        isRunning: false,
        remainingSeconds: 300,
        formattedClock: '05:00',
        durationSeconds: 300,
        fighterAName: '',
        fighterBName: '',
        category: '',
        aPoints: 0,
        aAdvantages: 0,
        aPenalties: 0,
        bPoints: 0,
        bAdvantages: 0,
        bPenalties: 0,
        computedWinner: 'DRAW',
        defaultMethod: 'Pontos',
        results: [],
      };

      let ws = null;
      let reconnectTimer = null;
      let editTarget = null;
      let selectedWinner = 'DRAW';
      let selectedMethod = 'Pontos';
      let confirmClearArmed = false;

      const $ = (id) => document.getElementById(id);

      function showToast(msg) {
        const el = $('toast');
        el.textContent = msg;
        el.classList.add('is-shown');
        clearTimeout(showToast._t);
        showToast._t = setTimeout(() => el.classList.remove('is-shown'), 1700);
      }

      function setConnected(live) {
        const pill = $('conn-pill');
        pill.classList.toggle('is-live', live);
        $('conn-label').textContent = live ? 'FEU BJJ · LIVE' : 'FEU BJJ…';
      }

      function sendCmd(payload) {
        const raw = JSON.stringify(payload);
        if (ws && ws.readyState === WebSocket.OPEN) {
          ws.send(raw);
          return;
        }
        fetch('/api/cmd', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: raw,
        })
          .then((r) => r.json())
          .then(applyServerState)
          .catch(() => setConnected(false));
      }

      function connectWs() {
        clearTimeout(reconnectTimer);
        const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
        try {
          ws = new WebSocket(`${proto}//${location.host}/ws`);
        } catch (_) {
          scheduleReconnect();
          return;
        }
        ws.onopen = () => {
          setConnected(true);
          if (!connectWs.openedOnce) {
            connectWs.openedOnce = true;
            sendCmd({ cmd: 'open_scoreboard' });
          }
        };
        ws.onmessage = (ev) => {
          try {
            applyServerState(JSON.parse(ev.data));
          } catch (_) {}
        };
        ws.onclose = () => {
          setConnected(false);
          scheduleReconnect();
        };
        ws.onerror = () => {
          try { ws.close(); } catch (_) {}
        };
      }

      function scheduleReconnect() {
        clearTimeout(reconnectTimer);
        reconnectTimer = setTimeout(connectWs, 600);
      }

      // Text typed on the phone stays "dirty" until the TV echoes the same value back. A command lost to a silent
      // disconnect is re-sent (heartbeat below), so the phone and the TV can never disagree about names/category.
      const dirtyText = {};
      const TEXT_COMMANDS = {
        fighterAName: (v) => ({ cmd: 'set_name', side: 'A', name: v }),
        fighterBName: (v) => ({ cmd: 'set_name', side: 'B', name: v }),
        category: (v) => ({ cmd: 'set_category', category: v }),
      };

      function typeText(key, value) {
        state[key] = value;
        dirtyText[key] = value;
        sendCmd(TEXT_COMMANDS[key](value));
      }

      function applyServerState(next) {
        if (!next || typeof next !== 'object') return;
        state = { ...state, ...next };
        for (const key of Object.keys(dirtyText)) {
          if (next[key] === undefined) continue;
          if (next[key] === dirtyText[key]) delete dirtyText[key];
          else state[key] = dirtyText[key];
        }
        render();
      }

      function resendDirtyText() {
        for (const key of Object.keys(dirtyText)) sendCmd(TEXT_COMMANDS[key](dirtyText[key]));
      }
      setInterval(resendDirtyText, 1200);
      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState !== 'visible') return;
        if (!ws || ws.readyState !== WebSocket.OPEN) connectWs();
        resendDirtyText();
      });

      function render() {
        const clk = $('btn-clock-edit');
        clk.textContent = state.leadInLabel ? state.leadInLabel : (state.formattedClock || '05:00');
        clk.classList.toggle('is-running', Boolean(state.isRunning));

        const playBtn = $('btn-play-pause');
        playBtn.textContent = state.isRunning ? '⏸ PAUSAR' : '▶ INICIAR';
        playBtn.classList.toggle('is-running', Boolean(state.isRunning));

        document.querySelectorAll('[data-dur]').forEach((b) => {
          b.classList.toggle('is-on', Number(b.dataset.dur) === Number(state.durationSeconds));
        });

        // Preserve active cursor if instructor is currently typing in an input
        const inpA = $('inp-name-a');
        if (document.activeElement !== inpA) inpA.value = state.fighterAName || '';
        const inpB = $('inp-name-b');
        if (document.activeElement !== inpB) inpB.value = state.fighterBName || '';
        const inpCat = $('inp-category');
        if (document.activeElement !== inpCat) inpCat.value = state.category || '';

        $('val-a-pts').textContent = state.aPoints;
        $('val-a-adv').textContent = `VANT: ${state.aAdvantages}`;
        $('val-a-pen').textContent = `PUN: ${state.aPenalties}`;

        $('val-b-pts').textContent = state.bPoints;
        $('val-b-adv').textContent = `VANT: ${state.bAdvantages}`;
        $('val-b-pen').textContent = `PUN: ${state.bPenalties}`;

        const results = Array.isArray(state.results) ? state.results : [];
        $('res-count').textContent = results.length;
        $('sheet-res-total').textContent = results.length;
        renderResultsList(results);
      }

      function formatSingleMatchText(r) {
        const cat = r.category ? `[${r.category}] ` : '';
        const winName =
          r.winnerSide === 'FIGHTER_A' ? r.fighterAName :
          r.winnerSide === 'FIGHTER_B' ? r.fighterBName : 'Empate';
        return `🏆 FEU BJJ ${cat}(${r.timestamp})\n` +
          `• ${r.fighterAName}: ${r.fighterAPoints} pts (${r.fighterAAdvantages}V / ${r.fighterAPenalties}P)\n` +
          `• ${r.fighterBName}: ${r.fighterBPoints} pts (${r.fighterBAdvantages}V / ${r.fighterBPenalties}P)\n` +
          `Resultado: ${winName} (${r.method})`;
      }

      async function shareText(title, text) {
        if (navigator.share) {
          try {
            await navigator.share({ title, text });
            return;
          } catch (_) {}
        }
        try {
          await navigator.clipboard.writeText(text);
          showToast('Copiado para a área de transferência!');
        } catch (_) {
          prompt('Copiar resultado:', text);
        }
      }

      function escapeHtml(s) {
        return String(s ?? '').replace(/[&<>"']/g, (c) => ({
          '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
        }[c]));
      }

      function renderResultsList(results) {
        const box = $('results-list');
        if (!results.length) {
          box.innerHTML = `<div style="text-align:center;padding:24px 8px;color:var(--muted);font-size:13px">Ainda não há lutas guardadas.</div>`;
          return;
        }
        box.innerHTML = results.map((r) => {
          const aWon = r.winnerSide === 'FIGHTER_A';
          const bWon = r.winnerSide === 'FIGHTER_B';
          const winLabel = aWon ? `🏆 ${escapeHtml(r.fighterAName)}` : bWon ? `🏆 ${escapeHtml(r.fighterBName)}` : '⚖ Empate';
          return `
            <div class="res-card">
              <div class="res-card__meta">
                <span>${escapeHtml(r.category || 'Tatami FEU BJJ')}</span>
                <span>${escapeHtml(r.timestamp)}</span>
              </div>
              <div class="res-card__line ${aWon ? 'res-card__win' : ''}">
                <span>${escapeHtml(r.fighterAName)}</span>
                <span>${r.fighterAPoints} pts · ${r.fighterAAdvantages}V · ${r.fighterAPenalties}P</span>
              </div>
              <div class="res-card__line ${bWon ? 'res-card__win' : ''}">
                <span>${escapeHtml(r.fighterBName)}</span>
                <span>${r.fighterBPoints} pts · ${r.fighterBAdvantages}V · ${r.fighterBPenalties}P</span>
              </div>
              <div class="res-card__actions">
                <span class="res-badge">${winLabel} · ${escapeHtml(r.method)}</span>
                <div style="display:flex;gap:6px">
                  <button type="button" class="mini-act" data-share-id="${escapeHtml(r.id)}">📤</button>
                  <button type="button" class="mini-act mini-act--danger" data-del-id="${escapeHtml(r.id)}">🗑</button>
                </div>
              </div>
            </div>
          `;
        }).join('');
      }

      // Live character-by-character streaming for names & category (zero delay)
      $('inp-name-a').addEventListener('input', (e) => typeText('fighterAName', e.target.value));
      $('inp-name-b').addEventListener('input', (e) => typeText('fighterBName', e.target.value));
      $('inp-category').addEventListener('input', (e) => typeText('category', e.target.value));

      document.querySelectorAll('[data-clear-name]').forEach((btn) => {
        btn.addEventListener('click', () => {
          const side = btn.dataset.clearName;
          const inp = side === 'A' ? $('inp-name-a') : $('inp-name-b');
          inp.value = '';
          typeText(side === 'A' ? 'fighterAName' : 'fighterBName', '');
          inp.focus();
        });
      });

      // Score delta buttons (+2, +3, +4, +1, -1, -2, Vant, Pun)
      document.querySelectorAll('[data-score]').forEach((btn) => {
        btn.addEventListener('click', () => {
          const [side, field, rawDelta] = btn.dataset.score.split(':');
          sendCmd({ cmd: 'score_delta', side, field, delta: Number(rawDelta) });
        });
      });

      // Direct edit modal for exact Points / Advantages / Penalties / Clock
      function openEditModal(target, title, initialValue, inputMode) {
        editTarget = target;
        $('edit-title').textContent = title;
        const inp = $('inp-direct-val');
        inp.inputMode = inputMode || 'numeric';
        inp.value = initialValue;
        $('sheet-edit').classList.add('is-open');
        setTimeout(() => { inp.focus(); inp.select(); }, 30);
      }

      document.querySelectorAll('[data-edit-score]').forEach((el) => {
        el.addEventListener('click', () => {
          const [side, field] = el.dataset.editScore.split(':');
          const cur =
            side === 'A'
              ? (field === 'points' ? state.aPoints : field === 'advantages' ? state.aAdvantages : state.aPenalties)
              : (field === 'points' ? state.bPoints : field === 'advantages' ? state.bAdvantages : state.bPenalties);
          const label = field === 'points' ? 'Pontos' : field === 'advantages' ? 'Vantagens' : 'Punições';
          openEditModal({ type: 'score', side, field }, `Editar ${label} (${side === 'A' ? 'Branco' : 'Vermelho'})`, String(cur), 'numeric');
        });
      });

      $('btn-clock-edit').addEventListener('click', () => {
        openEditModal({ type: 'clock' }, 'Editar Tempo (MM:SS ou Segundos)', state.formattedClock || '05:00', 'text');
      });

      function applyDirectEdit() {
        if (!editTarget) return;
        const raw = $('inp-direct-val').value.trim();
        if (editTarget.type === 'score') {
          const val = Math.max(0, parseInt(raw, 10) || 0);
          sendCmd({ cmd: 'score_set', side: editTarget.side, field: editTarget.field, value: val });
        } else if (editTarget.type === 'clock') {
          let secs = 300;
          if (raw.includes(':')) {
            const [m, s] = raw.split(':');
            secs = (parseInt(m, 10) || 0) * 60 + (parseInt(s, 10) || 0);
          } else {
            secs = parseInt(raw, 10) || 0;
          }
          sendCmd({ cmd: 'time_set', seconds: Math.max(1, secs) });
        }
        $('sheet-edit').classList.remove('is-open');
        editTarget = null;
      }

      $('btn-apply-edit').addEventListener('click', applyDirectEdit);
      $('inp-direct-val').addEventListener('keydown', (e) => {
        if (e.key === 'Enter') applyDirectEdit();
      });

      // Clock & utility controls
      $('btn-play-pause').addEventListener('click', () => sendCmd({ cmd: 'play_pause' }));
      $('btn-reset').addEventListener('click', () => sendCmd({ cmd: 'reset_match', keepNames: false }));
      $('btn-swap').addEventListener('click', () => sendCmd({ cmd: 'swap_sides' }));
      $('btn-buzzer').addEventListener('click', () => sendCmd({ cmd: 'buzzer' }));

      document.querySelectorAll('[data-cmd="time_delta"]').forEach((btn) => {
        btn.addEventListener('click', () => {
          sendCmd({ cmd: 'time_delta', delta: Number(btn.dataset.delta) });
        });
      });

      document.querySelectorAll('[data-dur]').forEach((btn) => {
        btn.addEventListener('click', () => {
          sendCmd({ cmd: 'set_duration', seconds: Number(btn.dataset.dur) });
        });
      });

      // Save Match Result Sheet
      const METHODS = ['Pontos', 'Finalização', 'Vantagens', 'Punições', 'DQ', 'Decisão'];

      function renderSaveChoices() {
        const nameA = state.fighterAName || 'Atleta 1 (Branco)';
        const nameB = state.fighterBName || 'Atleta 2 (Vermelho)';
        const winOpts = [
          ['FIGHTER_A', nameA],
          ['FIGHTER_B', nameB],
          ['DRAW', 'Empate'],
        ];
        $('winner-pills').innerHTML = winOpts.map(([id, lbl]) =>
          `<button type="button" class="choice-pill${selectedWinner === id ? ' is-on' : ''}" data-win-opt="${id}">${escapeHtml(lbl)}</button>`
        ).join('');

        $('method-pills').innerHTML = METHODS.map((m) =>
          `<button type="button" class="choice-pill${selectedMethod === m ? ' is-on' : ''}" data-method-opt="${m}">${m}</button>`
        ).join('');
      }

      $('btn-open-save').addEventListener('click', () => {
        selectedWinner = state.computedWinner || 'DRAW';
        selectedMethod = state.defaultMethod || 'Pontos';
        renderSaveChoices();
        $('sheet-save').classList.add('is-open');
      });

      $('winner-pills').addEventListener('click', (e) => {
        const btn = e.target.closest('[data-win-opt]');
        if (!btn) return;
        selectedWinner = btn.dataset.winOpt;
        renderSaveChoices();
      });

      $('method-pills').addEventListener('click', (e) => {
        const btn = e.target.closest('[data-method-opt]');
        if (!btn) return;
        selectedMethod = btn.dataset.methodOpt;
        renderSaveChoices();
      });

      function commitSave(alsoReset) {
        sendCmd({ cmd: 'save_result', winner: selectedWinner, method: selectedMethod });
        if (alsoReset) {
          sendCmd({ cmd: 'reset_match', keepNames: false });
        }
        $('sheet-save').classList.remove('is-open');
        showToast('Resultado guardado!');
      }

      $('btn-save-only').addEventListener('click', () => commitSave(false));
      $('btn-save-next').addEventListener('click', () => commitSave(true));

      // Results History Sheet
      $('btn-open-results').addEventListener('click', () => {
        confirmClearArmed = false;
        $('btn-clear-all').textContent = '🗑 Apagar Tudo';
        $('sheet-results').classList.add('is-open');
      });

      $('results-list').addEventListener('click', (e) => {
        const delBtn = e.target.closest('[data-del-id]');
        if (delBtn) {
          sendCmd({ cmd: 'delete_result', id: delBtn.dataset.delId });
          showToast('Luta removida');
          return;
        }
        const shareBtn = e.target.closest('[data-share-id]');
        if (shareBtn) {
          const item = (state.results || []).find((r) => r.id === shareBtn.dataset.shareId);
          if (item) shareText('Resultado FEU BJJ', formatSingleMatchText(item));
        }
      });

      $('btn-share-all').addEventListener('click', () => {
        const list = state.results || [];
        if (!list.length) return showToast('Sem resultados para partilhar');
        const text = `🏆 RESULTADOS FEU BJJ (${list.length} lutas)\n\n` + list.map(formatSingleMatchText).join('\n\n');
        shareText('Resultados FEU BJJ', text);
      });

      $('btn-export-csv').addEventListener('click', () => {
        const list = state.results || [];
        if (!list.length) return showToast('Sem resultados para exportar');
        const header = 'Data,Categoria,Atleta_Branco,Pts_A,Vant_A,Pun_A,Atleta_Vermelho,Pts_B,Vant_B,Pun_B,Vencedor,Metodo\n';
        const csvEsc = (v) => `"${String(v ?? '').replace(/"/g, '""')}"`;
        const rows = list.map((r) => [
          r.timestamp, r.category,
          r.fighterAName, r.fighterAPoints, r.fighterAAdvantages, r.fighterAPenalties,
          r.fighterBName, r.fighterBPoints, r.fighterBAdvantages, r.fighterBPenalties,
          r.winnerSide === 'FIGHTER_A' ? r.fighterAName : r.winnerSide === 'FIGHTER_B' ? r.fighterBName : 'Empate',
          r.method,
        ].map(csvEsc).join(',')).join('\n');
        const blob = new Blob([header + rows], { type: 'text/csv;charset=utf-8' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `feu-bjj-resultados-${new Date().toISOString().slice(0, 10)}.csv`;
        a.click();
      });

      $('btn-clear-all').addEventListener('click', () => {
        if (!confirmClearArmed) {
          confirmClearArmed = true;
          $('btn-clear-all').textContent = '⚠ Toca p/ Confirmar';
          return;
        }
        confirmClearArmed = false;
        $('btn-clear-all').textContent = '🗑 Apagar Tudo';
        sendCmd({ cmd: 'clear_results' });
        showToast('Todos os resultados apagados');
      });

      document.querySelectorAll('[data-close-sheet]').forEach((btn) => {
        btn.addEventListener('click', () => {
          $(btn.dataset.closeSheet).classList.remove('is-open');
        });
      });

      document.querySelectorAll('.sheet-backdrop').forEach((bd) => {
        bd.addEventListener('click', (e) => {
          if (e.target === bd) bd.classList.remove('is-open');
        });
      });

      connectWs();
    })();
  </script>
</body>
</html>
